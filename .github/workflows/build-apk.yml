name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.2.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.2.0.apk"
          ls -lh release-apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.2.0-APK
          path: release-apk/Meng-Health-v1.2.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Meng Health ${{ steps.release_tag.outputs.tag }} 体验重构与全面修复版
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Meng Health (梦健康) v1.2.0 体验重构与全面修复版 🥑
            
            ### 🛠️ 本次核心改进与修复：
            1. 🗓️ **日期支持自由左右横向滑动选周**：顶部增加横跨 6 周的可滑动日期条，可自由向左/向右滑动跨周查看（包括下周、上周），支持点击「回到今天」或翻页！
            2. 💾 **修复 AI 减脂计划与设置保存失效 Bug**：重构底层状态持久化，一键应用 AI 计划后立刻同步写入数据库并更新首页大盘预算，新增全局保存 Toast 提示。
            3. 📸 **AI 智能速记暗光与黑屏检测**：增加图像亮度与画面有效性检测算法，拍摄黑屏或过暗照片将明确友好提示重新拍摄，杜绝误识别为固定菜品。
            4. 🥑 **产品品牌与昵称更正**：全面更名为「Meng Health · 梦健康」，用户昵称与问候语统一设为「梦梦」。
            
            ### 📲 下载安装：
            请在下方 **Assets** 列表中下载 **`Meng-Health-v1.2.0.apk`** 直接覆盖安装即可体验！
          files: release-apk/Meng-Health-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
