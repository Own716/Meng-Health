name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare and Verify APK Signature
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.6.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.6.0.apk"
          ls -lh release-apk/
          echo "=== 正在校验 APK 签名证书指纹 (确保与永久密钥 menghealth.keystore 一致) ==="
          keytool -printcert -jarfile release-apk/Meng-Health-v1.6.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.6.0-APK
          path: release-apk/Meng-Health-v1.6.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.6.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Meng Health · 梦健康 ${{ steps.release_tag.outputs.tag }} 日历批量管理、代谢底线统一与确定性换算版
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Meng Health (梦健康) v1.6.0 综合发布说明 🥑
            
            ### 🌟 本次核心升级与关键修复：
            1. 📅 **【全新功能】饮食与体重记录日历化批量管理**：
               - 在“系统综合设置”中新增“饮食与体重记录管理”入口；
               - 提供全月日历视图、打卡状态蓝色圆点提示、多选日期高亮、本月全选与清空功能；
               - 配备二次防误触确认机制，确认后级联清空选中日期的所有饮食摄入与体重记录，并即时同步刷新全局主页。
            2. 🧮 **代谢算力与日历映射彻底统一 (BMR Floor 与缺口动态计算)**：
               - 全面统一「个人身材设置」与「AI 智能计划」算法引擎，严格遵循基础代谢 BMR Floor 保护底线；
               - 彻底消除触碰底线时文案建议与实际预算之间的数值矛盾；
               - 彻底剔除周六 2200 大卡放纵日及 1510 大卡占位残留，远期未记录日期自动同步当前激活计划的预算。
            3. 👁️ **AI 视觉识别、包装复合净重规则与前端确定性解耦**：
               - 针对方便面、自热食品等包装，确立全套总净含量优先级规则（如白象老坛酸菜牛肉面严格按 155g 全套净含量计算，绝不按 120g 面饼截断）；
               - AI 大模型视觉与数值计算彻底解耦：大模型纯粹提取品类、克重与标称每 100g 营养成分，总热量与三大营养素严格由前端确定性四则运算乘算，彻底规避计算幻觉（如天润浓缩纯牛奶 200g 精准输出 124 kcal 与 6.6g 蛋白）。
            4. 📈 **趋势页假数据彻底清除与纯真实状态保护**：
               - 彻底移除 `ProgressView` 中 88% 预算（1287/1540 kcal）填充与伪造递减走势；
               - 均值统计严格仅在“有真实记录的天数”间平均；未打卡日期呈现真实空点；体重走势锁定真实当前基准线。
            5. 🔘 **Switch 偏好设置开关动画修复**：
               - 重构设置页中 3 处 Switch 开关滑块动画，采用标准 GPU 加速平移过渡，滑动自然流畅。
            6. 🔐 **100% 保持官方永久签名证书 (`menghealth.keystore`)**：
               - 保持原有密钥指纹 `B4:C2:99:32:...` 永久不变，无需卸载已有旧版本，直接下载 APK 即可原位无缝覆盖更新！
            
            请在下方 **Assets** 列表中下载 **`Meng-Health-v1.6.0.apk`** 体验！
          files: release-apk/Meng-Health-v1.6.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
