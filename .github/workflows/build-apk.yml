name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare and Verify APK Signature
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.5.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.5.0.apk"
          ls -lh release-apk/
          echo "=== 正在校验 APK 签名证书指纹 (确保与永久密钥 menghealth.keystore 一致) ==="
          keytool -printcert -jarfile release-apk/Meng-Health-v1.5.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.5.0-APK
          path: release-apk/Meng-Health-v1.5.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.5.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Meng Health ${{ steps.release_tag.outputs.tag }} 真实联网检索、中国食物成分库与地道菜品拆解版
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Meng Health (梦健康) v1.5.0 真实联网检索、中国食物成分库与地道菜品拆解版 🥑
            
            ### 🌟 本次核心升级与全新特性：
            1. 🔍 **真实联网检索层 (Web Search) 与通道联通性测试**：深度融合智谱原生 Web Search 及 Tavily 实时 AI 搜索，支持直接检索商品真实包装配料表与权威参数；在设置中心配备“真实连通性测试”功能，发送真实 Query 并即时展示响应证据！
            2. 🥟 **中式传统饮食专项辨析与食材拆解 (彻底修复馒头夹菜识别为汉堡 Bug)**：引入中式地道菜品主食辨析引擎，彻底区分馒头夹菜/肉、烧饼夹菜、肉夹馍与西式汉堡；识别结果提供主料主食与配菜油盐拆解明细。
            3. 📚 **中国食物成分表权威数据库 6.0 深度融合**：内置白面馒头、肉夹馍、煎饼果子、常见家常炒菜、外卖中餐与知名品牌饮品包装权威基准，无缝提供权威核验认证标签。
            4. 🧮 **确定性纯四则运算科学计算器与 4P+4C+9F 一致性检验**：BMR、TDEE、热量预算与食物克重缩放完全由本地确定性科学公式计算，彻底杜绝大语言模型算数幻觉；引入宏量营养素物理能量守恒双向校验。
            5. 💾 **AI 减脂计划设置 100% 持久化保存**：解决二次打开计划弹窗参数丢失问题，当前体重、目标体重、身高、年龄、活动强度、周期天数与营养预算完整保存在手机本地并持久同步。
            6. 🏷️ **全站能量单位严格规范为「大卡」**：全面剔除生涩的「千卡」文案，全 App 统一为国人最熟悉的「大卡」（1 大卡 = 1 kcal = 4.184 kJ）。
            7. ⚖️ **识别结果分量快捷调节与条目管理**：识别后可一键增减克重，三大营养素自动等比四则运算重算，支持单独删除不想要的条目。
            8. 🔐 **100% 保持官方永久签名证书 (`menghealth.keystore`)**：无需卸载已有旧版本，直接下载 APK 即可原位无缝覆盖升级！
            
            请在下方 **Assets** 列表中下载 **`Meng-Health-v1.5.0.apk`** 体验！
          files: release-apk/Meng-Health-v1.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
