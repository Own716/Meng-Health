name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare and Verify APK Signature
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.3.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.3.0.apk"
          ls -lh release-apk/
          echo "=== 正在校验 APK 签名证书指纹 (确保与永久密钥 menghealth.keystore 一致) ==="
          keytool -printcert -jarfile release-apk/Meng-Health-v1.3.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.3.0-APK
          path: release-apk/Meng-Health-v1.3.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.3.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Meng Health ${{ steps.release_tag.outputs.tag }} 视觉大模型与永久签名重构版
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Meng Health (梦健康) v1.3.0 视觉大模型与永久签名重构版 🥑
            
            ### 🛠️ 本次核心重构与修复：
            1. 🤖 **彻底修复智谱 AI 视觉识别 (401 错误与兼容性)**：重构底层请求协议，完全适配智谱清言 (BigModel `glm-4v-flash`) 及标准 OpenAI 兼容多模态接口规范，自动附加 `Authorization: Bearer` 鉴权头。
            2. ⚡ **前端 Canvas 毫秒级图片压缩 (解决卡死与无限转圈)**：手机相机拍摄的 5MB~10MB 高清原图在上传前自动压制至最长边 1024px，体积骤降 98% (~100KB)，上传与解析响应仅需 1~2 秒！
            3. 🔐 **固化永久签名密钥 (解决每次更新需卸载旧版的问题)**：正式植入独立永久证书 `menghealth.keystore`（有效期至 2054 年），彻底终结 Android 系统“签名不一致导致无法覆盖更新”的历史问题！
            4. ⚙️ **独立「AI 接口配置中心」**：支持一键切换预设（智谱 GLM-4V-Flash 永久免费版、阿里云通义千问、Google Gemini 等），支持**一键网络连通性测试**，数据 100% 保存在手机本地。
            5. 💡 **智能容错与暗光拦截**：拍摄暗光/全黑照片智能拦截提醒，大模型返回解析支持任意杂乱说明自动提取精准 JSON 数组。
            
            ### 📲 安装升级指引：
            - **关于覆盖更新**：由于之前各测试版均由 GitHub Actions 临时随机签名，本次 v1.3.0 为**永久签名基准版本**。若您当前手机已安装旧版并提示签名不一致，请先在旧版中点击「数据备份」导出 JSON，卸载旧版并安装本次 **`Meng-Health-v1.3.0.apk`** 后点击导入恢复；**从此以后，所有后续版本（v1.4.0+）均可无缝直接覆盖安装，绝无需再卸载！**
            
            请在下方 **Assets** 列表中下载 **`Meng-Health-v1.3.0.apk`** 体验！
          files: release-apk/Meng-Health-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
