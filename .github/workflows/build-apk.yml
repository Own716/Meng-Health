name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.0.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.0.0.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.0.0-APK
          path: release-apk/Meng-Health-v1.0.0.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Meng Health v1.0.0 安装包发布
          body: |
            ## Meng Health (萌健康) v1.0.0 安装包
            
            ### ✨ 本次更新亮点：
            - 🥑 **全中文优雅 UI**：像素级还原设计图，纯正中文界面，无生硬英文。
            - 🎯 **热量预算仪表环**：动态计算今日剩余可吃千卡，一眼看清卡路里缺口。
            - 🥗 **三大营养素追踪**：蛋白质、碳水化合物、脂肪专属三色进度条。
            - ✨ **AI 智能速记卡片**：支持拍照估算与语言文字快速记餐，预留大模型 API 接口。
            - 📱 **iOS 16 悬浮毛玻璃底栏**：半透明高斯模糊质感，五大模块随心切换。
            - 💾 **数据备份与导出**：纯本地隐私存储，一键导出 JSON 备份文件，换手机零担忧。
            
            ### 📲 下载安装：
            请在下方 Assets 列表中下载 **`Meng-Health-v1.0.0.apk`** 直接安装在安卓手机上即可使用！
          files: release-apk/Meng-Health-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
