name: Build Meng Health APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare and Verify APK Signature
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Meng-Health-v1.4.0.apk
          echo "APK generated successfully at release-apk/Meng-Health-v1.4.0.apk"
          ls -lh release-apk/
          echo "=== 正在校验 APK 签名证书指纹 (确保与永久密钥 menghealth.keystore 一致) ==="
          keytool -printcert -jarfile release-apk/Meng-Health-v1.4.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meng-Health-v1.4.0-APK
          path: release-apk/Meng-Health-v1.4.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.4.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Meng Health ${{ steps.release_tag.outputs.tag }} 悬浮交互、设置中心与智能知识库升级版
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Meng Health (梦健康) v1.4.0 悬浮交互、设置中心与智能知识库升级版 🥑
            
            ### 🌟 本次核心升级与全新特性：
            1. 🎨 **悬浮底栏双层物理景深光影**：为浮动导航栏注入双层阴影与微光轮廓（`shadow-[0_16px_36px...] ring-1`），在上下滑动页面时形成自然分明的上下层空间景深，彻底告别平面贴图感！
            2. ⚙️ **全新「系统综合设置」抽屉**：将 AI 接口配置、大模型 Key、数据备份迁移、喝水/用餐提醒、热量预警与缓存清理统一归集至设置中心。
            3. 👤 **“我的”个人主页重塑**：剔除冗余复杂配置，仅保留两大最核心功能：
               - ✨ **AI 智能计算摄入量与摄出量**（基于身体代谢算法智能测算并一键生效）
               - 👤 **修改个人身材与基础热量**（纯净身材数据管理，自动联动推荐）
               - ⚙️ **系统综合设置**（位于主页底端独立收纳）
            4. 📷 **相册跳转修复 & 多图并发识别**：彻底解决点击相册却误唤起相机的 Bug。正式分离“📷 现场拍照”与“🖼️ 从相册选择”，相册支持多选照片，拍照支持连续加拍多道菜品，横向缩略条支持快速删除并由 AI 综合分析。
            5. 🧋 **本土零食与品牌奶茶知识库升级**：大模型提示词深度内嵌中国常见零食标准（卫龙辣条 65g、乐事薯片 70g、奥利奥 29g 等）与网红奶茶规格（蜜雪冰城/喜茶/霸王茶姬 500ml/650ml，加珍珠波霸/加奶盖热量加权计算），外卖餐盒自动根据 500ml/750ml/1000ml 标准换算食物密度。
            6. ⭕ **能量圆环直观文案**：首页预算文字更正为更易懂的「今日最多摄入量」。
            7. 📈 **7 天动态折线走势图**：趋势页新增交互式平滑 SVG 折线图与渐变填充面积图，搭配目标摄入虚线对照与体重曲线。
            8. ⚡ **四餐拍照快捷入口**：早餐、午餐、晚餐、加餐卡片与食物弹窗新增相机快捷按钮，一键拍摄直达对应餐别。
            9. 🔐 **100% 保持 v1.3.0 永久签名 (menghealth.keystore)**：无需卸载旧版，可在已有 v1.3.0 基础上直接点击 APK 覆盖更新！
            
            请在下方 **Assets** 列表中下载 **`Meng-Health-v1.4.0.apk`** 体验！
          files: release-apk/Meng-Health-v1.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
